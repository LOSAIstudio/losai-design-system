<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><title>Badge</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--losai-paper);margin:0}#root{padding:22px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.cap{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint);margin-bottom:10px}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.LOSAIStudioDesignSystem_3a6277;
const { Badge, Tag } = NS;
function Demo(){const [on,setOn]=React.useState(['Residential']);
const t=(k)=>setOn(o=>o.includes(k)?o.filter(x=>x!==k):[...o,k]);
return (<div className="col" style={{gap:26}}>
<div><div className="cap">Status</div><div className="row"><Badge variant="awarded">Awarded</Badge><Badge variant="review">In review</Badge><Badge variant="draft">Draft</Badge><Badge variant="closed">Closed</Badge><Badge variant="live">Live</Badge></div></div>
<div><div className="cap">Filter tags</div><div className="row">{['Residential','Institutional','Adaptive reuse','Interiors'].map(k=>(<Tag key={k} selected={on.includes(k)} onClick={()=>t(k)}>{k}</Tag>))}</div></div>
</div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
