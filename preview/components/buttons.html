<!-- @dsCard group="Components" name="Buttons" subtitle="Primary / secondary / text · 3 sizes · rest, hover, pressed, disabled"  viewport="1180x520" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LOSAI — Buttons</title>
<link rel="stylesheet" href="../losai.css" />
</head>
<body class="losai">
<main class="losai-sheet">
  <div class="losai-section-head">
    <span class="losai-eyebrow">01 · Buttons</span><span class="losai-rule--flex"></span>
  </div>

  <div class="losai-label" style="margin-bottom:18px">Variants (medium)</div>
  <div style="display:flex;gap:20px;align-items:center;margin-bottom:40px">
    <button class="losai-btn losai-btn--primary">Submit proposal</button>
    <button class="losai-btn losai-btn--secondary">Download brief</button>
    <button class="losai-btn losai-btn--text">View full set</button>
  </div>

  <div class="losai-label" style="margin-bottom:18px">Sizes</div>
  <div style="display:flex;gap:20px;align-items:center;margin-bottom:40px">
    <button class="losai-btn losai-btn--primary losai-btn--sm">Small</button>
    <button class="losai-btn losai-btn--primary">Medium</button>
    <button class="losai-btn losai-btn--primary losai-btn--lg">Large</button>
  </div>

  <div class="losai-label" style="margin-bottom:18px">Disabled</div>
  <div style="display:flex;gap:20px;align-items:center">
    <button class="losai-btn losai-btn--primary" disabled>Primary</button>
    <button class="losai-btn losai-btn--secondary" disabled>Secondary</button>
    <button class="losai-btn losai-btn--text" disabled>Text</button>
  </div>
</main>
</body>
</html>
