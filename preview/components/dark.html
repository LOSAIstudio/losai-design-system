<!-- @dsCard group="Foundations" name="Dark / over image" subtitle="Dark scope (gold lifts to #c49a5c) and the photographic cover"  viewport="1180x900" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LOSAI — Dark / over image</title>
<link rel="stylesheet" href="../losai.css" />
</head>
<body class="losai">
<main class="losai-sheet">
  <div class="losai-section-head">
    <span class="losai-eyebrow">08 · Dark / over image</span><span class="losai-rule--flex"></span>
  </div>

  <div class="losai-dark" style="padding:40px 44px">
    <div class="losai-masthead">
      <img src="../brand/losai-logo-white.png" alt="LOSAI studio" />
      <span class="losai-masthead-divider"></span>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="losai-label">LOSAI-2026-016</span>
        <span class="losai-sub" style="font-size:15px;color:var(--losai-prose)">Meserole Ave</span>
      </div>
    </div>
    <div style="display:flex;gap:20px;align-items:center;margin-top:32px">
      <button class="losai-btn losai-btn--primary">Submit proposal</button>
      <button class="losai-btn losai-btn--secondary">Download brief</button>
      <span class="losai-badge losai-badge--dot">Live</span>
    </div>
    <p class="losai-prose" style="margin-top:24px;max-width:60ch">Prose on dark is never pure white — it settles to #d8d5cc. Gold lifts to #c49a5c to hold against the surface.</p>
  </div>

  <div class="losai-cover" style="height:340px;margin-top:32px">
    <img src="../img/DSCF2168.jpg" alt="" />
    <div class="losai-cover-scrim"></div>
    <div class="losai-cover-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <img src="../brand/losai-logo-white.png" alt="LOSAI studio" style="height:20px;width:auto;display:block" />
        <span class="losai-label">Request for Proposal · 2026</span>
      </div>
      <div style="flex:1"></div>
      <h1 class="losai-cover-title">Architectural photography<br /><em>Meserole Avenue townhouse</em></h1>
      <div class="losai-cover-meta">Brooklyn, New York</div>
    </div>
  </div>
</main>
</body>
</html>
