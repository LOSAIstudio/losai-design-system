<!-- @dsCard group="Components" name="Badges & tags" subtitle="Status badges (ink, gold, draft, closed, live dot) · filter tags"  viewport="1180x460" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LOSAI — Badges & tags</title>
<link rel="stylesheet" href="../losai.css" />
</head>
<body class="losai">
<main class="losai-sheet">
  <div class="losai-section-head">
    <span class="losai-eyebrow">06 · Badges &amp; tags</span><span class="losai-rule--flex"></span>
  </div>

  <div class="losai-label" style="margin-bottom:18px">Status badges</div>
  <div style="display:flex;gap:16px;align-items:center;margin-bottom:40px">
    <span class="losai-badge losai-badge--ink">Awarded</span>
    <span class="losai-badge losai-badge--gold">In review</span>
    <span class="losai-badge">Draft</span>
    <span class="losai-badge losai-badge--muted">Closed</span>
    <span class="losai-badge losai-badge--dot">Live</span>
  </div>

  <div class="losai-label" style="margin-bottom:18px">Filter tags — selected / unselected / disabled</div>
  <div style="display:flex;gap:12px;align-items:center">
    <button class="losai-tag is-selected">Interior</button>
    <button class="losai-tag">Exterior</button>
    <button class="losai-tag">Detail</button>
    <button class="losai-tag" disabled>Archive</button>
  </div>
</main>
</body>
</html>
