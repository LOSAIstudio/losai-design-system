  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

acing surfaces ───────────────────────────── */\n/* cp-paper is ALWAYS the ground of the client portal and the website.\n   The rest are the CP v2 proposal's own neutrals — read from\n   docs/refs/cp-v2/CP_v2.html, the 301 18th reference file. */\n--losai-cp-paper:#f4f1ea;\n--losai-cp-wordmark-ink:#514c47;\n--losai-cp-card:#f7f5ef;\n--losai-cp-tint:#ebe7dc;\n--losai-cp-rule:#d8d2c4;\n--losai-cp-rule-strong:#b9b1a0;\n/* Lighter gold — marks a derived or unconfirmed number */\n--losai-cp-uncertain:#dab050;\n/* Warm rose-tan — hovers, beacons and focus underlines in the proposal */\n--losai-cp-accent:#cd9181;\n\n/* ── Tagline blue — the italic descriptor line, and nothing else ─ */\n--losai-tagline:#4c586e;\n\n/* ── Masthead lockup ─────────────────────────────────────── */\n--losai-paper-warm:#f4f1ea;\n--losai-mark:#514c47;\n\n/* ── Semantic aliases ─────────────────────────────────────────── */\n--losai-surface-page:var(--losai-paper);\n--losai-surface-sunken:var(--losai-tint);\n--losai-surface-desk:var(--losai-desk);\n--losai-text-body:var(--losai-prose);\n--losai-text-strong:var(--losai-ink);\n--losai-text-muted:var(--losai-label);\n--losai-text-faint:var(--losai-faint);\n--losai-text-accent:var(--losai-gold);\n--losai-text-error:var(--losai-alert);\n--losai-text-tagline:var(--losai-tagline);\n--losai-border-structural:var(--losai-rule-strong);\n--losai-border-internal:var(--losai-rule);\n--losai-action-fill:var(--losai-ink);\n--losai-action-fill-hover:#3a352e;\n--losai-action-fill-active:#000000;\n--losai-action-text:var(--losai-paper);\n}\n\n/* ── Dark scope — Cover surfaces. Never pure white text. ──────── */\n.losai-dark{\n--losai-paper:#1c1a17;\n--losai-ink:#faf9f5;\n--losai-prose:#d8d5cc;\n--losai-label:#b5ae9f;\n--losai-faint:#8a8375;\n--losai-disabled:#5c574e;\n--losai-gold:#c49a5c;\n--losai-alert:#c96a52;\n--losai-tagline:#93a3c4;\n--losai-mark:#d8d5cc;\n--losai-rule-strong:rgba(250,249,245,.28);\n--losai-rule:rgba(250,249,245,.16);\n--losai-rule-light:rgb 400;font-style:italic;font-size:calc(21.22px*var(--k));line-height:1.15;color:#4c586e;white-space:nowrap}\n.lock>.srf{position:absolute;left:calc(var(--pl)*1px*var(--k));top:calc((var(--pt) - 4.78)*1px*var(--k));width:calc(217px*var(--k));font-family:var(--losai-font-voice);font-weight:500;font-size:calc(47.8px*var(--k));letter-spacing:.04em;line-height:1;white-space:nowrap;color:var(--losai-mark)}\n.lock>.srf em{font-style:italic;font-weight:400;font-size:.56em;letter-spacing:.03em;margin-left:.3em}\n.lock-dark>.rl{background:rgba(250,249,245,.28)}\n.lock-dark>.dsc{color:rgba(250,249,245,.72)}\n.pfb{font-family:var(--losai-font-info);font-size:9pt;letter-spacing:.15em;text-transform:uppercase;line-height:1;padding:12pt 15pt;border:1px solid #c8c4b8;background:#f4f1ea;color:#1c1a17;white-space:nowrap}\n.pft{font-family:var(--losai-font-info);font-size:10.5pt;letter-spacing:.18em;text-transform:uppercase;line-height:1;padding:13.5pt 0 9pt;color:#bc9381;border-bottom:1px solid transparent;margin-bottom:-1px}\n.pft-on{color:#823930;border-bottom-color:#823930}\n.cnote{background:#ece9e0;border:1px solid #c8c4b8;padding:13pt 15pt;margin-top:19pt;break-inside:avoid}\n.cnote-h{font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.18em;text-transform:uppercase;color:#3a352e;margin-bottom:7pt}\n.cnote p{font-size:10pt;line-height:1.5;margin:0;color:#3a352e;max-width:none}\n.type-lock{font-family:var(--losai-font-voice);font-weight:500;letter-spacing:.04em;line-height:1;white-space:nowrap;color:var(--losai-mark);display:block}\n.type-lock em{font-style:italic;font-weight:400;font-size:.56em;letter-spacing:.03em;margin-left:.3em}\n.btn{display:inline-flex;align-items:center;white-space:nowrap;gap:7pt;font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.18em;text-transform:uppercase;line-height:1;padding:10.5pt 22.5pt;border:1px solid transparent}\n.btn-p{background:#1c1a17;color:#faf9f5}\n.btn-p-h{background:#3a352e;color:#faf9f5}\n.btn-p-a{backgr 14pt;font-family:var(--losai-font-voice);font-size:11pt;line-height:1.55;color:var(--losai-prose)}\nli{margin-bottom:6pt;orphans:3;widows:3}\n.runfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--losai-rule);padding-top:6pt}\n.pgn{font-family:var(--losai-font-info);font-size:6.5pt;letter-spacing:.12em;color:var(--losai-faint)}\n#flow{position:relative}\n.pgmark{position:absolute;right:0;text-align:right;font-family:var(--losai-font-info);font-size:6.5pt;letter-spacing:.12em;color:var(--losai-faint);display:none}\n@media print{.pgmark{display:block}}\n<\u002Fstyle>\n<\u002Fhead><body>\n<doc-page margin=\"0.75in\">\n\n<div slot=\"footer\" class=\"runfoot\">\n<span style=\"display:flex;align-items:center;gap:9pt\"><img src=\"a7c4057c-673a-4c0c-bd8d-c9191fbd3e0b\" alt=\"LOSAI\" style=\"display:block;width:52px;height:auto;flex:none\"><span class=\"cap\">© LOSAI studio 2026 · All rights reserved<\u002Fspan><\u002Fspan>\n<span class=\"cap\">Brand &amp; System Standards v3<\u002Fspan>\n<\u002Fdiv>\n\n<div id=\"flow\">\n\n<div class=\"blk\" style=\"border-top:1px solid var(--losai-ink);padding-top:14pt\">\n<div class=\"lock lock-plain\">\n<img class=\"mk\" src=\"a7c4057c-673a-4c0c-bd8d-c9191fbd3e0b\" alt=\"LOSAI\">\n<span class=\"rl\"><\u002Fspan>\n<div class=\"dsc\">Architecture &amp; Design<\u002Fdiv>\n<div class=\"tg\">Designing city and country homes as places of refuge.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid var(--losai-rule-strong);margin-bottom:26pt\"><\u002Fdiv>\n<h1 style=\"font-weight:300;font-size:32pt;line-height:1.05\">Brand &amp;<br><em style=\"font-style:italic;font-weight:300\">system standards<\u002Fem><\u002Fh1>\n<div style=\"border-top:1px solid var(--losai-rule-strong);margin-top:22pt;padding-top:11pt;display:flex;gap:26pt;flex-wrap:wrap\">\n<span class=\"lbl\">Version 3.0<\u002Fspan><span class=\"lbl\">Two typefaces<\u002Fspan><span class=\"lbl\">One accent<\u002Fspan><span class=\"lbl\">Eight component families<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"note\">\n<div class=\"note-head\"><span class=\"lbl\">Confidential — use by consent only<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<p style=\"font-size:10.5pt;margin:0\">This document and the design system it describes are the property of LOSAI studio. They are supplied in confidence, for the sole purpose of work commissioned by the studio. No part of this system — its typography, colour, components, wordmark or written guidance — may be copied, redistributed, adapted or used in any project, product or publication without the prior written consent of LOSAI studio. Consent is required for every use, including internal prototypes and unpublished work.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p class=\"lead\">Every value here is normative. Where a measurement is given in pixels, implement that pixel value.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Contents<\u002Fdiv>\n<table class=\"tok\"><tbody>\n<tr><td class=\"m\">01<\u002Ftd><td>Identity<\u002Ftd><td class=\"d\">Wordmark, lockup, name and tagline<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">02<\u002Ftd><td>Colour<\u002Ftd><td class=\"d\">Surfaces, ink, rules, accent, dark scope<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">03<\u002Ftd><td>Typography<\u002Ftd><td class=\"d\">Two families, two scales<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">04<\u002Ftd><td>Spacing &amp; geometry<\u002Ftd><td class=\"d\">Scale, hairlines, corners<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">05<\u002Ftd><td>Motion &amp; states<\u002Ftd><td class=\"d\">Hover, press, focus, disabled<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">06<\u002Ftd><td>Components<\u002Ftd><td class=\"d\">Eight families, specified<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">07<\u002Ftd><td>Voice &amp; iconography<\u002Ftd><td class=\"d\">Copy rules, permitted glyphs<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">08<\u002Ftd><td>Standards<\u002Ftd><td class=\"d\">The rules that fail review<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">09<\u002Ftd><td>Implementation<\u002Ftd><td class=\"d\">Files, bundle, namespace<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Identity<\u002Fh2><span class=\"eyebrow\">01<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">The identity is a lockup: the LOSAI mark, the discipline line and the tagline, set together and never re-spaced.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"note\">\n<div class=\"note-head\"><span class=\"lbl\">The name<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<p style=\"font-size:10.5pt;margin:0 0 8pt\"><strong>LOSAI<\u002Fstrong> is <em>loci<\u002Fem> — <code>/ˈloʊ.saɪ/<\u002Fcode>, the plural of <em>locus<\u002Fem>. The studio takes its name from the method of loci, the classical memory technique that binds what you want to remember to a place you already know. The practice describes itself as a team of placemakers: buildings designed as anchors for experience and memory, not only as functional shells.<\u002Fp>\n<p style=\"font-size:10.5pt;margin:0\">That idea governs the restraint of this system. A page is a place — ordered, quiet, and legible enough to be remembered. Ornament competes with recall, so there is none.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lock\">\n<img class=\"mk\" src=\"a7c4057c-673a-4c0c-bd8d-c9191fbd3e0b\" alt=\"LOSAI\">\n<span class=\"rl\"><\u002Fspan>\n<div class=\"dsc\">Architecture &amp; Design<\u002Fdiv>\n<div class=\"tg\">Designing city and country homes as places of refuge.<\u002Fdiv>\n<\u002Fdiv>\n<table class=\"tok\" style=\"margin-top:14pt\">\n<thead><tr><th style=\"width:30%\">Element<\u002Fth><th style=\"width:26%\">Specification<\u002Fth><th>Colour<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Mark<\u002Ftd><td class=\"m\">217 × 44px<\u002Ftd><td class=\"m\">#524d48<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Gap to rule<\u002Ftd><td class=\"m\">31px<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Rule<\u002Ftd><td class=\"m\">1px × 45px<\u002Ftd><td class=\"m\">#c8c4b8<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Gap to text<\u002Ftd><td class=\"m\">24px<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Discipline line<\u002Ftd><td class=\"m\">Mono 11.43px · 0.15em caps<\u002Ftd><td class=\"m\">#8f877f<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Tagline<\u002Ftd><td class=\"m\">Cormorant italic 21.22px · 1.15<\u002Ftd><td class=\"m\">#4c586e<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Ground<\u002Ftd><td class=\"m\">731 × 132px · mark at 27,47<\u002Ftd><td class=\"m\">#f4f1ea<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p style=\"margin-top:12pt\">Resize the lockup as a single unit. Its internal spacing, rule height and type sizes scale together and are never adjusted independently.<\u002Fp>\n<p><strong>The lockup is never rebuilt.<\u002Fstrong> A masthead, a cover, a footer, a title page — each places this same lockup, scaled, cropped to its 45px content band. Nothing is re-composed from its parts: the mark is not resized against a different hairline, and the gaps are not re-set by eye.<\u002Fp>\n<p><strong>The discipline line aligns with the top of the mark.<\u002Fstrong> Its capitals and the mark's cap-height share one horizontal, which is what holds the two halves of the lockup together.<\u002Fp>\n<p><strong>The second line is a slot.<\u002Fstrong> It carries the tagline on brand surfaces and the <strong>project, set in serif<\u002Fstrong> — \"West 84th Street\", not a mono code — on every working surface: mastheads, covers, footers. It is never left empty beside a filled discipline line.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"pair\">\n<div class=\"stack\" style=\"gap:18pt\">\n<img class=\"wm\" src=\"a7c4057c-673a-4c0c-bd8d-c9191fbd3e0b\" alt=\"LOSAI\" style=\"width:160px\">\n<img class=\"wm\" src=\"47057870-7e15-4c11-8017-dbe38daa176b\" alt=\"LOSAI studio\" style=\"width:160px\">\n<span class=\"type-lock\" style=\"width:160px;font-size:35.3px;line-height:.94\">LOSAI<em>studio<\u002Fem><\u002Fspan>\n<span class=\"cap\">On paper · #524d48<\u002Fspan>\n<\u002Fdiv>\n<div class=\"stack\" style=\"gap:18pt;background:#1c1a17\">\n<img class=\"wm\" src=\"a6049a01-d1f2-480a-b839-7857333136fc\" alt=\"LOSAI\" style=\"width:160px\">\n<img class=\"wm\" src=\"2d80bced-d7fd-4e25-b186-ceb72c0caa63\" alt=\"LOSAI studio\" style=\"width:160px\">\n<span class=\"type-lock\" style=\"width:160px;font-size:35.3px;line-height:.94;color:#faf9f5\">LOSAI<em>studio<\u002Fem><\u002Fspan>\n<span class=\"cap\" style=\"color:#8a8375\">Over dark or imagery · #faf9f5<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<table class=\"tok\">\n<thead><tr><th style=\"width:22%\">Variant<\u002Fth><th style=\"width:16%\">Aspect<\u002Fth><th style=\"width:32%\">File<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">losai<\u002Ftd><td class=\"m\">4.975 : 1<\u002Ftd><td class=\"m\">logo-losai-ink.png<br>logo-losai-paper.png<\u002Ftd><td class=\"d\">Default — the lockup, mastheads, favicons, stamps<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">signature<\u002Ftd><td class=\"m\">8.38 : 1<\u002Ftd><td class=\"m\">logo-ink.png<br>logo-paper.png<\u002Ftd><td class=\"d\">Where the mark must carry the word studio on its own<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">type<\u002Ftd><td class=\"m\">—<\u002Ftd><td class=\"m\">Cormorant 500 + italic 400<\u002Ftd><td class=\"d\">Stand-in where no mark file is available<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">square<\u002Ftd><td class=\"m\">1 : 1<\u002Ftd><td class=\"m\">logo-square-ink.png<br>logo-square-paper.png<br>logo-square-mark.png<\u002Ftd><td class=\"d\">Avatars, favicons, seals — where the lockup cannot fit<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p style=\"margin-top:12pt\">Reproduce the mark from the supplied files only. Height 14–22px, proportions locked, placed on paper, ink or a photograph and no other field.<\u002Fp>\n<p><strong>The mark never stands alone.<\u002Fstrong> Wherever it appears — the lockup, a masthead, a cover, a footer — it is followed by the vertical hairline and the discipline line, <span class=\"m\">ARCHITECTURE &amp; DESIGN<\u002Fspan>, in mono caps. The tagline or project code may sit beneath it, but the discipline line is not optional and the hairline is never left hanging with nothing after it. The square stamp below is the single exception.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Square stamp<\u002Fdiv>\n<div class=\"row\" style=\"gap:19pt;align-items:flex-end;flex-wrap:nowrap\">\n<img src=\"2da8ae2a-2997-493c-ab7d-e6c4592d1a17\" alt=\"LOSAI\" style=\"display:block;width:78px;height:78px\">\n<img src=\"5b5809a4-4026-45da-96d1-17794c6521c1\" alt=\"LOSAI\" style=\"display:block;width:78px;height:78px\">\n<img src=\"2da8ae2a-2997-493c-ab7d-e6c4592d1a17\" alt=\"LOSAI\" style=\"display:block;width:48px;height:48px\">\n<img src=\"2da8ae2a-2997-493c-ab7d-e6c4592d1a17\" alt=\"LOSAI\" style=\"display:block;width:30px;height:30px\">\n<img src=\"2da8ae2a-2997-493c-ab7d-e6c4592d1a17\" alt=\"LOSAI\" style=\"display:block;width:24px;height:24px\">\n<\u002Fdiv>\n<p style=\"margin-top:12pt\">The emblem — a separate piece of artwork, not the horizontal mark re-set: an open square bracket enclosing the name, supplied as a 1373×1373 master. Use it where the composition is square and the lockup cannot fit — an avatar, a favicon, a social profile, a seal stamped on a drawing. The mark occupies <strong>70% of the edge with a 15% margin<\u002Fstrong> on all four sides. It carries no colour of its own: the ground is <span class=\"m\">--losai-cp-paper<\u002Fspan> <span class=\"m\">#f4f1ea<\u002Fspan> with the mark in <span class=\"m\">--losai-cp-wordmark-ink<\u002Fspan> <span class=\"m\">#514c47<\u002Fspan>, or ink <span class=\"m\">#1c1a17<\u002Fspan> with the mark reversed. Square corners, never rounded.<\u002Fp>\n<p><strong>Minimum 24px.<\u002Fstrong> The bracket is drawn in hairlines; below 24px they close up and the square reads as a filled box. Use the horizontal mark instead at smaller sizes.<\u002Fp>\n<p>This is the only lockup that omits the discipline line, because at stamp sizes nothing else is legible.<\u002Fp>\n<p><strong>Serif stand-in.<\u002Fstrong> Where no mark file can be loaded, set the name in Cormorant 500 capitals with the italic \"studio\" at <code>font-size: 0.56em<\u002Fcode>, baseline-aligned, with a 0.3em space. Pair it with the same discipline line and tagline as the lockup.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Serif stand-in<\u002Fdiv>\n<div class=\"lock lock-plain\" style=\"border:1px solid var(--losai-rule-strong)\">\n<span class=\"srf\">LOSAI<em>studio<\u002Fem><\u002Fspan>\n<span class=\"rl\"><\u002Fspan>\n<div class=\"dsc\">Architecture &amp; Design<\u002Fdiv>\n<div class=\"tg\">Designing city and country homes as places of refuge.<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin-top:12pt\">For environments that cannot load the mark files — plain-text signatures, third-party systems, fallback rendering. Everywhere else, the mark is used.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Name &amp; tagline<\u002Fdiv>\n<table class=\"tok\"><tbody>\n<tr><td class=\"m\" style=\"width:32%\">Studio name<\u002Ftd><td>LOSAI studio<div class=\"csub\">Capitals then lowercase. Never \"LOSAI Studio\", never all caps in body copy.<\u002Fdiv><\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Discipline line<\u002Ftd><td>Architecture &amp; Design<div class=\"csub\">Mono capitals, tracked. \"· New York\" is appended only where the lockup is absent.<\u002Fdiv><\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Tagline<\u002Ftd><td style=\"color:#4c586e;font-style:italic\">Designing city and country homes as places of refuge.<div class=\"csub\" style=\"font-style:normal\">Italic Cormorant, tagline blue #4c586e.<\u002Fdiv><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Identity<\u002Fdiv>\n<p>Place <span class=\"m\">Lockup<\u002Fspan> — never rebuild it from the mark, a rule and two lines. The mark never stands alone: the hairline and discipline line always follow. The second line is a slot — tagline on brand surfaces, the project in serif on working ones. Use the supplied PNGs; set the name in type only when no mark file can load.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Colour<\u002Fh2><span class=\"eyebrow\">02<\u002Fspan><\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Surfaces<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:48pt\"><\u002Fth><th style=\"width:26%\">Token<\u002Fth><th style=\"width:18%\">Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"chip\" style=\"background:#faf9f5;outline:.5px solid #e2dfd6\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-paper<\u002Ftd><td class=\"m\">#faf9f5<\u002Ftd><td class=\"d\">The page itself<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#f4f1ea\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-paper-warm<\u002Ftd><td class=\"m\">#f4f1ea<\u002Ftd><td class=\"d\">Masthead lockup ground<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#e6e5e1\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-desk<\u002Ftd><td class=\"m\">#e6e5e1<\u002Ftd><td class=\"d\">Ground behind the page<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#f4f2ec\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-tint<\u002Ftd><td class=\"m\">#f4f2ec<\u002Ftd><td class=\"d\">Active or hovered table row<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#ece9e0\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-image-bg<\u002Ftd><td class=\"m\">#ece9e0<\u002Ftd><td class=\"d\">Holds a photograph before it loads<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Ink &amp; text<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:48pt\"><\u002Fth><th style=\"width:26%\">Token<\u002Fth><th style=\"width:18%\">Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"chip\" style=\"background:#1c1a17\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-ink<\u002Ftd><td class=\"m\">#1c1a17<\u002Ftd><td class=\"d\">Headings, values, primary fill<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#3a352e\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-prose<\u002Ftd><td class=\"m\">#3a352e<\u002Ftd><td class=\"d\">Body copy, primary hover<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#524d48\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-mark<\u002Ftd><td class=\"m\">#524d48<\u002Ftd><td class=\"d\">Wordmark grey<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#8a8375\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-label<\u002Ftd><td class=\"m\">#8a8375<\u002Ftd><td class=\"d\">Mono labels and eyebrows<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#a8a297\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-faint<\u002Ftd><td class=\"m\">#a8a297<\u002Ftd><td class=\"d\">Inactive nav, captions<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#c8c4b8\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-disabled<\u002Ftd><td class=\"m\">#c8c4b8<\u002Ftd><td class=\"d\">Dead control text<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Rules — hairlines only<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:48pt\"><\u002Fth><th style=\"width:26%\">Token<\u002Fth><th style=\"width:18%\">Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"chip\" style=\"background:#c8c4b8\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-rule-strong<\u002Ftd><td class=\"m\">1px #c8c4b8<\u002Ftd><td class=\"d\">Structural — page divisions, card outlines, meta caps<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#e2dfd6\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-rule<\u002Ftd><td class=\"m\">1px #e2dfd6<\u002Ftd><td class=\"d\">Internal — card footers, meta-cell splits<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#ece9e0\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-rule-light<\u002Ftd><td class=\"m\">#ece9e0<\u002Ftd><td class=\"d\">Lightest division<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#e2dfd6\"><\u002Fspan><\u002Ftd><td class=\"m\">separator<\u002Ftd><td class=\"m\">0.5px #e2dfd6<\u002Ftd><td class=\"d\">Table row separators<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#1c1a17\"><\u002Fspan><\u002Ftd><td class=\"m\">ink rule<\u002Ftd><td class=\"m\">1px #1c1a17<\u002Ftd><td class=\"d\">Under a table header; above a figure card<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Accent, alert &amp; tagline<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:48pt\"><\u002Fth><th style=\"width:26%\">Token<\u002Fth><th style=\"width:18%\">Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"chip\" style=\"background:#a5824e\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-gold<\u002Ftd><td class=\"m\">#a5824e<\u002Ftd><td class=\"d\">One bearer per view. Never over imagery.<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#9c3f2c\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-alert<\u002Ftd><td class=\"m\">#9c3f2c<\u002Ftd><td class=\"d\">Field errors and caution callouts<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#4c586e\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-tagline<\u002Ftd><td class=\"m\">#4c586e<\u002Ftd><td class=\"d\">The italic tagline or descriptor line<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<div class=\"blk\" style=\"margin-top:22pt\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Valcucine — a separate palette<\u002Fdiv>\n<p>Sampled from the flat bands of the Valcucine Wunderkammer campaign cover and ruled 2026-08-21. Held apart from the core neutrals: these do <strong>not<\u002Fstrong> replace antique gold as the accent, and they do not licence a second accent in one view. Blue is the only one with an interface role beyond the portal.<\u002Fp>\n<table class=\"tok\">\n<thead><tr><th style=\"width:48pt\"><\u002Fth><th style=\"width:26%\">Token<\u002Fth><th style=\"width:18%\">Value<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td><span class=\"chip\" style=\"background:#4c586e\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-val-blue<\u002Ftd><td class=\"m\">#4c586e<\u002Ftd><td class=\"d\">Tagline, descriptor and project lines<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#823930\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-val-red<\u002Ftd><td class=\"m\">#823930<\u002Ftd><td class=\"d\">The portal’s active tab and its 1px underline<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#b96e4f\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-val-orange<\u002Ftd><td class=\"m\">#b96e4f<\u002Ftd><td class=\"d\">Campaign only<\u002Ftd><\u002Ftr>\n<tr><td><span class=\"chip\" style=\"background:#bc9381\"><\u002Fspan><\u002Ftd><td class=\"m\">--losai-val-beige<\u002Ftd><td class=\"m\">#bc9381<\u002Ftd><td class=\"d\">Campaign; reads as a lighter gold. The portal’s inactive tab<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p style=\"margin-top:12pt\">Two client-facing surface tokens travel with them: <span class=\"m\">--losai-cp-paper<\u002Fspan> <span class=\"m\">#f4f1ea<\u002Fspan>, always the ground of the client portal and the website, and <span class=\"m\">--losai-cp-wordmark-ink<\u002Fspan> <span class=\"m\">#514c47<\u002Fspan>, the mark’s uniform ink.<\u002Fp>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Blue is not a second accent. It never becomes a button, border, badge or chart colour, and it does not count against the single gold bearer.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Where the single gold bearer may land<\u002Fdiv>\n<div class=\"metarow\" style=\"grid-template-columns:repeat(4,1fr)\">\n<div><div class=\"lbl\">Index numerals<\u002Fdiv><div style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.14em;color:#a5824e;margin-top:7pt\">01 02 03<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lbl\">Active nav<\u002Fdiv><div style=\"font-family:var(--losai-font-info);font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:#1c1a17;border-bottom:1px solid #a5824e;display:inline-block;padding-bottom:2pt;margin-top:7pt\">Documents<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lbl\">In review<\u002Fdiv><div style=\"margin-top:7pt\"><span class=\"badge b-rv\">In review<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"lbl\">Selected tick<\u002Fdiv><div style=\"font-family:var(--losai-font-info);font-size:9pt;color:#a5824e;margin-top:7pt\">✓<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">One bearer, not one pixel — an index column of seven numerals is a single mark. Every component that can carry gold takes an opt-out: <code>Masthead activeTone=\"ink\"<\u002Fcode>, <code>Thumbnail accent={false}<\u002Fcode>, <code>Callout accent={false}<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Dark scope — <code>.losai-dark<\u002Fcode><\u002Fdiv>\n<div style=\"background:#1c1a17;padding:16pt 18pt\">\n<table class=\"tok\" style=\"margin:0\"><tbody>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#1c1a17;outline:.5px solid rgba(250,249,245,.28)\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-paper<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#1c1a17<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#faf9f5\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-ink<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#faf9f5<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#d8d5cc\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-prose<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#d8d5cc<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#b5ae9f\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-label<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#b5ae9f<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#8a8375\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-faint<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#8a8375<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#c49a5c\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-gold<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#c49a5c<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#c96a52\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-alert<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#c96a52<\u002Ftd><\u002Ftr>\n<tr><td style=\"border-color:#33302a\"><span class=\"chip\" style=\"background:#93a3c4\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border-color:#33302a\">--losai-tagline<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border-color:#33302a\">#93a3c4<\u002Ftd><\u002Ftr>\n<tr><td style=\"border:0\"><span class=\"chip\" style=\"background:rgba(250,249,245,.28)\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border:0\">--losai-rule-strong<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border:0\">rgba(250,249,245,.28)<\u002Ftd><\u002Ftr>\n<tr><td style=\"border:0\"><span class=\"chip\" style=\"background:rgba(250,249,245,.16)\"><\u002Fspan><\u002Ftd><td class=\"m\" style=\"color:#d8d5cc;border:0\">--losai-rule<\u002Ftd><td class=\"m\" style=\"color:#b5ae9f;border:0\">rgba(250,249,245,.16)<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Prose over dark is #d8d5cc, never pure white. Primary buttons invert to a paper fill with ink text. Over imagery, gold is dropped entirely.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Colour<\u002Fdiv>\n<p>Nothing outside <span class=\"m\">tokens/colors.css<\u002Fspan>. Gold marks exactly one thing per view and never sits over imagery. <span class=\"m\">#9c3f2c<\u002Fspan> is error and caution only. The Valcucine four are a separate palette: blue for tagline and project lines, red for the portal’s active tab; orange and beige are campaign colours, not interface colours.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Typography<\u002Fh2><span class=\"eyebrow\">03<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">Two families. Cormorant Garamond is the voice; JetBrains Mono is the information layer and is always uppercase. They never swap roles.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Cormorant Garamond — 300 / 400 / 500 + italics<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:22%\">Role<\u002Fth><th style=\"width:20%\">Size<\u002Fth><th style=\"width:16%\">Leading<\u002Fth><th>Applied to<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">display<\u002Ftd><td class=\"m\">44px<\u002Ftd><td class=\"m\">1.05<\u002Ftd><td class=\"d\">Cover titles, page openers — weight 300<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">title<\u002Ftd><td class=\"m\">30px<\u002Ftd><td class=\"m\">1.1<\u002Ftd><td class=\"d\">Screen headings<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">lead<\u002Ftd><td class=\"m\">22px italic<\u002Ftd><td class=\"m\">1.4<\u002Ftd><td class=\"d\">The sentence opening a section — weight 300<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">card<\u002Ftd><td class=\"m\">21px<\u002Ftd><td class=\"m\">1.2<\u002Ftd><td class=\"d\">Card titles<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">value<\u002Ftd><td class=\"m\">17px<\u002Ftd><td class=\"m\">1.5<\u002Ftd><td class=\"d\">Field values, spec values, totals<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">prose<\u002Ftd><td class=\"m\">16px<\u002Ftd><td class=\"m\">1.55<\u002Ftd><td class=\"d\">Body copy, table cells<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">sub<\u002Ftd><td class=\"m\">12.5px italic<\u002Ftd><td class=\"m\">1.4<\u002Ftd><td class=\"d\">Subtitles, helper text, descriptors<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"spec\">\n<div style=\"font-family:var(--losai-font-voice);font-weight:300;font-size:30pt;line-height:1.05;color:#1c1a17\">A brownstone rebuilt<br><em style=\"font-weight:300\">around light<\u002Fem><\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:20pt;color:#1c1a17;margin-top:14pt\">Design Development<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-weight:300;font-style:italic;font-size:15pt;color:#3a352e;margin-top:8pt\">Six weeks of coordination, drawn once.<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:11.5pt;line-height:1.55;color:#3a352e;margin-top:12pt;max-width:52ch\">The parlour floor is opened end to end, and the rear wall rebuilt in glass so the garden reads from the street door.<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-style:italic;font-size:9pt;color:#8a8375;margin-top:8pt\">Drawing set issued 14 January 2026<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">JetBrains Mono — 400 / 500, always uppercase<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:22%\">Role<\u002Fth><th style=\"width:20%\">Size<\u002Fth><th style=\"width:20%\">Tracking<\u002Fth><th>Applied to<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">eyebrow<\u002Ftd><td class=\"m\">9px<\u002Ftd><td class=\"m\">0.20em<\u002Ftd><td class=\"d\">Section eyebrows, cover labels<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">label<\u002Ftd><td class=\"m\">8px<\u002Ftd><td class=\"m\">0.16em<\u002Ftd><td class=\"d\">Field labels, table headers, nav, badges<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">caption<\u002Ftd><td class=\"m\">7.5px<\u002Ftd><td class=\"m\">0.12em<\u002Ftd><td class=\"d\">Filenames, footnotes, counts<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">index<\u002Ftd><td class=\"m\">9px<\u002Ftd><td class=\"m\">0.14em<\u002Ftd><td class=\"d\">Index numerals — in gold<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">button<\u002Ftd><td class=\"m\">9px<\u002Ftd><td class=\"m\">0.18em<\u002Ftd><td class=\"d\">Every button label, at every size<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"spec stack\">\n<div style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.20em;text-transform:uppercase;color:#8a8375\">Eyebrow — project schedule<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-info);font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:#8a8375\">Label — issued for coordination<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-info);font-size:5.6pt;letter-spacing:.12em;text-transform:uppercase;color:#a8a297\">Caption — w84_ext_03.tif<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.14em;color:#a5824e\">01 &nbsp; 02 &nbsp; 03 &nbsp; INDEX IN GOLD<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Mono never sets a sentence — only a label, a code, a number or a date. Mono labels are nouns of two or three words and take no verb.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Typography<\u002Fdiv>\n<p>Two families and no third register. Cormorant is sentence case and never tracked; mono is always uppercase at 0.12–0.22em. Do not introduce a sans for interface text — mono <em>is<\u002Fem> the interface voice.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Spacing &amp; geometry<\u002Fh2><span class=\"eyebrow\">04<\u002Fspan><\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Scale<\u002Fdiv>\n<div style=\"display:flex;gap:11pt;align-items:flex-end\">\n<div style=\"text-align:center\"><div style=\"width:3pt;height:3pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">4<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:6pt;height:6pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">8<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:10.5pt;height:10.5pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">14<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:16.5pt;height:16.5pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">22<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:22.5pt;height:22.5pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">30<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:33pt;height:33pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">44<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:48pt;height:48pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">64<\u002Fdiv><\u002Fdiv>\n<div style=\"text-align:center\"><div style=\"width:72pt;height:72pt;background:#e2dfd6\"><\u002Fdiv><div class=\"cap\" style=\"margin-top:5pt\">96<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<table class=\"tok\">\n<thead><tr><th style=\"width:34%\">Measurement<\u002Fth><th style=\"width:22%\">Value<\u002Fth><th>Note<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Page gutter<\u002Ftd><td class=\"m\">44px<\u002Ftd><td class=\"d\">22px on small screens<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Page width<\u002Ftd><td class=\"m\">1280px<\u002Ftd><td class=\"d\">Centred paper on a #e6e5e1 desk<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Table row padding<\u002Ftd><td class=\"m\">14px 0<\u002Ftd><td class=\"d\">Vertical only<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Meta cell padding<\u002Ftd><td class=\"m\">14px 22px<\u002Ftd><td class=\"d\"><\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Spec label column<\u002Ftd><td class=\"m\">150px<\u002Ftd><td class=\"d\">Fixed, 22px gutter<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Prose measure<\u002Ftd><td class=\"m\">64ch<\u002Ftd><td class=\"d\">Body copy never runs wider<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Editorial split<\u002Ftd><td class=\"m\">1.4fr / 1fr<\u002Ftd><td class=\"d\">Preferred over equal columns<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">border-radius<\u002Ftd><td class=\"m\">0<\u002Ftd><td class=\"d\">Everywhere<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Radio circle<\u002Ftd><td class=\"m\">14px / 50%<\u002Ftd><td class=\"d\">The only round element in the system<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"pair\">\n<div><div class=\"lbl\">Correct<\u002Fdiv><div style=\"height:30pt;border:1px solid #1c1a17;margin-top:8pt\"><\u002Fdiv><p class=\"cap\" style=\"margin-top:8pt\">Square. Hairline. Flat.<\u002Fp><\u002Fdiv>\n<div><div class=\"lbl\">Never<\u002Fdiv><div style=\"height:30pt;border:1px solid #c8c4b8;border-radius:8px;margin-top:8pt\"><\u002Fdiv><p class=\"cap\" style=\"margin-top:8pt\">No radius, no shadow, no gradient, no coloured left border.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Spacing &amp; geometry<\u002Fdiv>\n<p>Reach for the next step up the scale before adding an element. Structural rules stay 1px whatever the spacing. Square corners everywhere; the radio dot is the only circle. When a layout feels wrong, add space rather than decoration.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Motion &amp; states<\u002Fh2><span class=\"eyebrow\">05<\u002Fspan><\u002Fdiv>\n\n<div class=\"blk\">\n<table class=\"tok\">\n<thead><tr><th style=\"width:26%\">Property<\u002Fth><th style=\"width:34%\">Value<\u002Fth><th>Note<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Easing<\u002Ftd><td class=\"m\">cubic-bezier(0.22, 1, 0.36, 1)<\u002Ftd><td class=\"d\">The only curve<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Durations<\u002Ftd><td class=\"m\">0.12s / 0.18s / 0.32s<\u002Ftd><td class=\"d\">fast / base / slow<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Animated props<\u002Ftd><td class=\"m\">color, background, border-color, opacity<\u002Ftd><td class=\"d\">Nothing else animates<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Focus ring<\u002Ftd><td class=\"m\">0 0 0 1px #faf9f5, 0 0 0 2px #a5824e<\u002Ftd><td class=\"d\">A paper gap, then gold<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p class=\"cap\" style=\"margin-top:9pt\">No entrance animations, no parallax, no bounce, no scaling. If a page moves, it is because a value changed.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">State matrix<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:26%\">Element<\u002Fth><th style=\"width:24%\">Hover<\u002Fth><th style=\"width:24%\">Press<\u002Fth><th>Disabled<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Button primary<\u002Ftd><td class=\"m\">#3a352e<\u002Ftd><td class=\"m\">#000, +1px Y<\u002Ftd><td class=\"m\">#e2dfd6 / #a8a297<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Button secondary<\u002Ftd><td class=\"m\">border → ink<\u002Ftd><td class=\"m\">+1px Y<\u002Ftd><td class=\"m\">border #e2dfd6<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Button text<\u002Ftd><td class=\"m\">label + rule → gold<\u002Ftd><td class=\"m\">+1px Y<\u002Ftd><td class=\"m\">#c8c4b8<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Bordered card<\u002Ftd><td class=\"m\">border → ink<\u002Ftd><td class=\"m\">—<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Table row<\u002Ftd><td class=\"m\">background #f4f2ec<\u002Ftd><td class=\"m\">#f4f2ec<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Field<\u002Ftd><td class=\"m\">—<\u002Ftd><td class=\"m\">underline → gold on focus<\u002Ftd><td class=\"m\">value italic, #a8a297<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Nav item<\u002Ftd><td class=\"m\">#a8a297 → ink<\u002Ftd><td class=\"m\">—<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Filter tag<\u002Ftd><td class=\"m\">border + label → ink<\u002Ftd><td class=\"m\">ink fill when selected<\u002Ftd><td class=\"m\">—<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p class=\"cap\" style=\"margin-top:9pt\">Nothing lifts, scales, glows or shrinks. Hover darkens ink or turns a hairline to ink — that is the whole vocabulary.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Motion &amp; states<\u002Fdiv>\n<p>Transitions carry colour and border only, 0.2s on the standard easing. The button’s 1px active shift is the only transform. No bounce, no scale-in, no parallax, no blur.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Components<\u002Fh2><span class=\"eyebrow\">06<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">Eight families. Every specimen is rendered at its true specification.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Button<\u002Fdiv>\n<div class=\"spec stack\" style=\"gap:16pt\">\n<div><div class=\"cap\" style=\"margin-bottom:9pt\">Variants · size M · 14px 30px<\u002Fdiv>\n<div class=\"row\"><span class=\"btn btn-p\">Request drawings<\u002Fspan><span class=\"btn btn-s\">Download PDF<\u002Fspan><span class=\"btn btn-t\">View schedule →<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"cap\" style=\"margin-bottom:9pt\">Sizes · S 9px 18px · M 14px 30px · L 19px 44px<\u002Fdiv>\n<div class=\"row\"><span class=\"btn btn-p btn-sm\">Small<\u002Fspan><span class=\"btn btn-p\">Medium<\u002Fspan><span class=\"btn btn-p btn-lg\">Large<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"cap\" style=\"margin-bottom:9pt\">States<\u002Fdiv>\n<div class=\"row\"><span class=\"btn btn-p-h\">Hover<\u002Fspan><span class=\"btn btn-p-a\">Active<\u002Fspan><span class=\"btn btn-p-d\">Disabled<\u002Fspan><span class=\"btn btn-s-h\">Secondary hover<\u002Fspan><span class=\"btn btn-t-h\">Text hover<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<pre style=\"margin-top:12pt\">&lt;Button variant=\"primary\" size=\"m\"&gt;Request drawings&lt;/Button&gt;\n&lt;Button variant=\"secondary\" size=\"s\"&gt;Download PDF&lt;/Button&gt;\n&lt;Button variant=\"text\"&gt;View the full schedule →&lt;/Button&gt;<\u002Fpre>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div
