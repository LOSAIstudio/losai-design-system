ss=\"badge b-aw\">Residential<\u002Fspan><span class=\"badge b-dr\">Institutional<\u002Fspan><span class=\"badge b-dr\">Adaptive reuse<\u002Fspan><span class=\"badge b-dr\">Interiors<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Square, mono 8px 0.16em caps, padding 5px 11px. In review and Live are the gold-bearing variants — at most one per view, never both.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Callout<\u002Fdiv>\n<div class=\"spec stack\" style=\"gap:18pt;align-items:stretch\">\n<div style=\"font-family:var(--losai-font-voice);font-weight:300;font-style:italic;font-size:15pt;line-height:1.4;color:#3a352e\">A brownstone rebuilt around the way its owners actually move through a day.<\u002Fdiv>\n<div class=\"note\">\n<div class=\"note-head\"><span class=\"lbl\">Note<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:11pt;line-height:1.55;color:#3a352e\">Drawings are issued for coordination only until the DOB filing is stamped.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10pt;align-items:flex-start\">\n<span class=\"sq\" style=\"background:#9c3f2c;margin-top:6pt\"><\u002Fspan>\n<div><div class=\"lbl\" style=\"color:#9c3f2c\">Caution<\u002Fdiv><div style=\"font-family:var(--losai-font-voice);font-size:11pt;line-height:1.55;color:#3a352e;margin-top:6pt\">Cellar floor plans fall outside the current fee agreement.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div class=\"quote\"><span style=\"color:#a5824e;font-style:normal\">“<\u002Fspan>Light is the first material, and the only one we cannot order.<\u002Fdiv>\n<div style=\"margin-top:19pt;border-top:1px solid #e2dfd6;padding-top:10pt\"><span class=\"lbl\">Leo Sguera · Principal<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Caution is the only component carrying #9c3f2c — on the 5px square and the label; the prose stays #3a352e. The pull quote's opening mark is gold.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Cover / Dark<\u002Fdiv>\n<div style=\"background:#1c1a17;padding:22pt;display:flex;flex-direction:column;justify-content:space-between;min-height:165pt\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:22pt\">\n<div class=\"lock lock-plain lock-tight lock-dark\" style=\"--k:.70\">\n<img class=\"mk\" src=\"a6049a01-d1f2-480a-b839-7857333136fc\" alt=\"LOSAI\">\n<span class=\"rl\"><\u002Fspan>\n<div class=\"dsc\">Architecture &amp; Design<\u002Fdiv>\n<div class=\"tg\">West 84th Street<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.20em;text-transform:uppercase;white-space:nowrap;color:rgba(250,249,245,.72)\">Project 2025-114<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:30pt\">\n<div style=\"font-family:var(--losai-font-voice);font-weight:300;font-size:28pt;line-height:1.05;color:#faf9f5\">A brownstone<br><em style=\"font-style:italic;font-weight:300\">rebuilt around light<\u002Fem><\u002Fdiv>\n<div style=\"margin-top:19pt;border-top:1px solid rgba(250,249,245,.28);padding-top:10pt;display:flex;gap:22pt;flex-wrap:wrap\">\n<span style=\"font-family:var(--losai-font-info);font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,249,245,.72)\">Upper West Side<\u002Fspan>\n<span style=\"font-family:var(--losai-font-info);font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,249,245,.72)\">Design Development<\u002Fspan>\n<span style=\"font-family:var(--losai-font-info);font-size:6pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(250,249,245,.72)\">2025—2027<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:16pt\"><span class=\"btn\" style=\"background:#faf9f5;color:#1c1a17;padding:8pt 18pt\">View the project<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Over a photograph, a bottom-weighted scrim <code>linear-gradient(to top, rgba(20,18,15,.78), rgba(20,18,15,.18))<\u002Fcode> — the only gradient in the system. Gold is never used over imagery.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Proposal — service / line-item block<\u002Fdiv>\n<div style=\"width:672px;max-width:100%;overflow:hidden\"><div style=\"width:900px;zoom:.7467\"><div class=\"spec\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:20pt\">\n<span style=\"display:flex;align-items:center;gap:10pt\">\n<span style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.14em;text-transform:uppercase;color:#a5824e\">01<\u002Fspan>\n<span style=\"width:25pt;height:1px;background:#c8c4b8\"><\u002Fspan>\n<span class=\"lbl\">SD / DD<\u002Fspan>\n<\u002Fspan>\n<span class=\"cap\">2 included · subtotal<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20pt;margin-top:10pt\">\n<span style=\"font-family:var(--losai-font-voice);font-weight:300;font-size:22.5pt;line-height:1.1;color:#1c1a17\">Design &amp; Code Compliance<\u002Fspan>\n<span style=\"font-family:var(--losai-font-voice);font-weight:300;font-size:22.5pt;line-height:1.1;color:#1c1a17;white-space:nowrap\">$2,000<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-style:italic;font-size:11.25pt;color:#8a8375;margin-top:5pt\">Concept through coordinated documentation.<\u002Fdiv>\n\n<div style=\"border-top:1px solid #e2dfd6;margin-top:19.5pt\">\n<div style=\"display:grid;grid-template-columns:30pt 49.5pt 1fr 157.5pt 90pt 19.5pt;gap:12pt;align-items:start;padding:15pt 0;border-bottom:1px solid #e2dfd6\">\n<span style=\"width:16.5pt;height:16.5pt;border:1.5px solid #1c1a17;background:#1c1a17;color:#faf9f5;font:9.75pt/1 var(--losai-font-info);display:flex;align-items:center;justify-content:center;margin-top:2.25pt\">✓<\u002Fspan>\n<span style=\"font-family:var(--losai-font-info);font-size:7.5pt;letter-spacing:.13em;text-transform:uppercase;color:#8a8375;padding-top:4.5pt\">PD<\u002Fspan>\n<div>\n<div style=\"font-family:var(--losai-font-voice);font-size:15pt;line-height:1.25;color:#1c1a17\">Pre-Design (Existing Conditions)<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:10.5pt;font-style:italic;color:#8a8375;margin-top:2.25pt\">Survey, measurement, abatement coordination<\u002Fdiv>\n<ol style=\"margin:10.5pt 0 0;padding:0;list-style:none\">\n<li style=\"font-family:var(--losai-font-voice);font-size:10.9pt;color:#3a352e;padding:3pt 0 3pt 19.5pt;position:relative;border-bottom:1px dotted #e2dfd6\"><span style=\"position:absolute;left:0;top:6pt;font-family:var(--losai-font-info);font-size:7.1pt;color:#a8a297\">01<\u002Fspan>Field measurement of any spaces to remain<\u002Fli>\n<li style=\"font-family:var(--losai-font-voice);font-size:10.9pt;color:#3a352e;padding:3pt 0 3pt 19.5pt;position:relative\"><span style=\"position:absolute;left:0;top:6pt;font-family:var(--losai-font-info);font-size:7.1pt;color:#a8a297\">02<\u002Fspan>Coordinate asbestos testing &amp; air monitoring<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:var(--losai-font-info);font-size:7.1pt;letter-spacing:.15em;text-transform:uppercase;color:#a8a297;padding-top:4.5pt\">1 week<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:10.1pt;font-style:italic;color:#8a8375;padding-top:4.5pt\">\n<span style=\"font-style:normal;font-family:var(--losai-font-info);font-size:7.1pt;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:5.25pt;color:#a8a297\">Deliverables<\u002Fspan>\n<div style=\"padding:2.25pt 0;border-bottom:1px dotted #e2dfd6\">EC measured set<\u002Fdiv>\n<div style=\"padding:2.25pt 0;border-bottom:1px dotted #e2dfd6\">Demolition scope memo<\u002Fdiv>\n<div style=\"padding:2.25pt 0\">Base drawings<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align:right;font-family:var(--losai-font-voice);font-size:14.25pt;padding-top:3pt;color:#a5824e\">$800<\u002Fdiv>\n<span style=\"color:#a8a297;font-size:11.25pt;padding:3pt;font-family:var(--losai-font-info)\">×<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:30pt 49.5pt 1fr 157.5pt 90pt 19.5pt;gap:12pt;align-items:start;padding:15pt 0\">\n<span style=\"width:16.5pt;height:16.5pt;border:1.5px solid #1c1a17;background:#1c1a17;color:#faf9f5;font:9.75pt/1 var(--losai-font-info);display:flex;align-items:center;justify-content:center;margin-top:2.25pt\">✓<\u002Fspan>\n<span style=\"font-family:var(--losai-font-info);font-size:7.5pt;letter-spacing:.13em;text-transform:uppercase;color:#8a8375;padding-top:4.5pt\">DD<\u002Fspan>\n<div>\n<div style=\"font-family:var(--losai-font-voice);font-size:15pt;line-height:1.25;color:#1c1a17\">Design Development (Code Compliance)<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-voice);font-size:10.5pt;font-style:italic;color:#8a8375;margin-top:2.25pt\">Refine, coordinate, lock systems<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family:var(--losai-font-info);font-size:7.1pt;letter-spacing:.15em;text-transform:uppercase;color:#a8a297;padding-top:4.5pt\">4 weeks<\u002Fdiv>\n<div style=\"text-align:right;font-family:var(--losai-font-voice);font-size:14.25pt;padding-top:3pt;color:#a5824e\">$1,200<\u002Fdiv>\n<span style=\"color:#a8a297;font-size:11.25pt;padding:3pt;font-family:var(--losai-font-info)\">+<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">Shown at 75% — the row grid is a fixed 1366px-context composition. Row grid 40 / 66 / 1fr / 210 / 120 / 26px at 16px gap and 20px 0 padding · rows separated by 1px #e2dfd6, none on the last · unselected rows at 42% · tick 22px with a 1.5px #c8c4b8 border · code mono 10px/0.13em · name 20px/1.25 · detail 14px italic · fee 19px right · scope bullets 14.5px on dotted rules with a leading-zero mono counter · deliverables 13.5px italic. Line fees carry the gold; subtotals and the grand total stay ink.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Eyebrow + hairline<\u002Fdiv>\n<div class=\"spec\">\n<div style=\"display:flex;align-items:center;gap:13.5pt\">\n<span style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.14em;text-transform:uppercase;color:#a5824e;flex:none\">01<\u002Fspan>\n<span style=\"font-family:var(--losai-font-info);font-size:6.75pt;letter-spacing:.18em;text-transform:uppercase;color:#1c1a17;flex:none;white-space:nowrap\">The main space<\u002Fspan>\n<span style=\"flex:1;height:1px;background:#e2dfd6\"><\u002Fspan>\n<span class=\"cap\" style=\"flex:none;white-space:nowrap\">the open volume under the mashrabiya<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p class=\"cap\" style=\"margin-top:9pt\">An index, a tracked label, a rule that takes the remaining width, and an optional note at the far right. Opens a section without a heading.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Components<\u002Fdiv>\n<p>Mount what exists rather than re-implementing it, and extend through props rather than forking. One primary action per view. Where a photograph belongs, place a hairline frame with a mono filename caption and ask for the real image.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Voice &amp; iconography<\u002Fh2><span class=\"eyebrow\">07<\u002Fspan><\u002Fdiv>\n\n<div class=\"blk\">\n<table class=\"tok\">\n<thead><tr><th style=\"width:26%\">Rule<\u002Fth><th>Detail<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Casing<\u002Ftd><td class=\"d\">Sentence case for all Cormorant. Uppercase for all mono. There is no third register.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Person<\u002Ftd><td class=\"d\">Third person for the record, second person for the client. The studio rarely says \"we\".<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Studio name<\u002Ftd><td class=\"d\">Always \"LOSAI studio\" — capitals then lowercase.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Dates<\u002Ftd><td class=\"d\">\"14 January 2026\" in prose; \"14 Jan 2026\" in mono.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Money<\u002Ftd><td class=\"d\">Exact and unrounded — $29,700, never $30k.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Phases<\u002Ftd><td class=\"d\">Two digits — 01, never 1.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Project names<\u002Ftd><td class=\"d\">Name then neighbourhood — \"Landmark Townhouse, Park Slope\"; \"Duplex Penthouse, Flatiron District\".<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Italics<\u002Ftd><td class=\"d\">The secondary voice only: subtitle, descriptor, lead line, helper text.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Emoji<\u002Ftd><td class=\"d\">Never, in any surface.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Site navigation<\u002Ftd><td class=\"d\">Prefixed with a low line and set lowercase — _about, _projects, _services, _journal, _contact us. Primary site navigation only.<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"pair\">\n<div><div class=\"lbl\">Correct<\u002Fdiv><p style=\"font-size:10.5pt;margin-top:8pt\">\"A brownstone rebuilt around the way its owners actually move through a day.\"<\u002Fp><p style=\"font-size:10.5pt;margin:0\">\"Cellar floor plans fall outside the current fee agreement.\"<\u002Fp><\u002Fdiv>\n<div><div class=\"lbl\">Never<\u002Fdiv><p style=\"font-size:10.5pt;margin-top:8pt\">\"We're thrilled to share your updated designs!\"<\u002Fp><p style=\"font-size:10.5pt;margin:0\">\"Unlock premium insights into your project journey.\"<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Iconography<\u002Fdiv>\n<p>The system carries no icon font, no sprite and no icon library. Status, action and navigation are named in mono capitals, because a word is more precise than a pictogram and reads correctly at 8px. These are the permitted glyphs.<\u002Fp>\n<table class=\"tok\">\n<thead><tr><th style=\"width:14%\">Glyph<\u002Fth><th>Use<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\" style=\"font-size:11pt\">→<\u002Ftd><td class=\"d\">Trailing an action label or card footer<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\" style=\"font-size:11pt\">←<\u002Ftd><td class=\"d\">A back action<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\" style=\"font-size:11pt\">✓<\u002Ftd><td class=\"d\">A checked checkbox; a selected thumbnail<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\" style=\"font-size:11pt\">/<\u002Ftd><td class=\"d\">Breadcrumb separator, in #c8c4b8<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\" style=\"font-size:11pt\">“<\u002Ftd><td class=\"d\">The gold opening mark of a pull quote<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\" style=\"font-size:11pt\">·<\u002Ftd><td class=\"d\">Joining metadata fragments<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p style=\"margin-top:12pt\">Solid squares stand where an icon would otherwise go — a 5px #a5824e square marks a live item, a 5px #9c3f2c square a caution, a 4px #9c3f2c square a field error. Draw them with a <code>&lt;span&gt;<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Voice &amp; iconography<\u002Fdiv>\n<p>Sentence case in Cormorant, uppercase in mono. No emoji. No hand-drawn SVG icons — use the supplied assets or ask for them. Third person for the record, second person for the client; the studio rarely says “we”.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Standards<\u002Fh2><span class=\"eyebrow\">08<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">These are review-blocking. Work that breaks one of them is wrong regardless of how it looks.<\u002Fp>\n<div class=\"blk\">\n<ul>\n<li><strong>The lockup is not re-spaced.<\u002Fstrong> Scale it as one unit; never adjust the mark, rule, discipline line or tagline independently.<\u002Fli>\n<li><strong>Two typefaces only.<\u002Fstrong> Cormorant Garamond and JetBrains Mono.<\u002Fli>\n<li><strong>Mono is always uppercase.<\u002Fstrong> Every label, code, badge, nav item, table header and button label.<\u002Fli>\n<li><strong>Square corners.<\u002Fstrong> <code>border-radius: 0<\u002Fcode> everywhere; the 14px radio circle is the only exception.<\u002Fli>\n<li><strong>Hairlines only.<\u002Fstrong> 1px #c8c4b8 structural, 1px #e2dfd6 internal, 0.5px separators. Never a heavy or black bar.<\u002Fli>\n<li><strong>No shadows.<\u002Fstrong> Depth is expressed by rules and tonal shifts.<\u002Fli>\n<li><strong>No gradients<\u002Fstrong>, except the Cover scrim over a photograph.<\u002Fli>\n<li><strong>One gold bearer per view.<\u002Fstrong> If a view shows two, one is a mistake.<\u002Fli>\n<li><strong>Gold never appears over imagery.<\u002Fstrong><\u002Fli>\n<li><strong>#9c3f2c is for error and caution only.<\u002Fstrong><\u002Fli>\n<li><strong>#4c586e is for the tagline only.<\u002Fstrong> Blue is not a second accent.<\u002Fli>\n<li><strong>Prose over dark is #d8d5cc<\u002Fstrong> — never pure white.<\u002Fli>\n<li><strong>No blur and no frosted glass.<\u002Fstrong> Transparency appears only in the dark scope's hairlines and the Cover scrim.<\u002Fli>\n<li><strong>No emoji and no icon library.<\u002Fstrong><\u002Fli>\n<li><strong>Exact values.<\u002Fstrong> 12.5px and 0.5px are implemented as written.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Standards<\u002Fdiv>\n<p>These are review-blocking. Work that breaks one of them is wrong regardless of how it looks — check against this list before presenting anything.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Implementation<\u002Fh2><span class=\"eyebrow\">09<\u002Fspan><\u002Fdiv>\n\n<p>Link one stylesheet. It imports the whole token closure — colour, typography, spacing, borders, motion, base reset, and both webfonts, which are served from Google Fonts.<\u002Fp>\n<pre>&lt;link rel=\"stylesheet\" href=\"styles.css\"&gt;<\u002Fpre>\n<p style=\"margin-top:12pt\">Components are bundled to a single global namespace. React 18 must be present.<\u002Fp>\n<pre>&lt;script src=\"_ds_bundle.js\"&gt;&lt;/script&gt;\n\nconst { Button, Field, Card, Table, Masthead, Badge, Callout, Cover }\n  = window.LOSAIStudioDesignSystem_3a6277;<\u002Fpre>\n\n<div class=\"blk\" style=\"margin-top:22pt\">\n<table class=\"tok\">\n<thead><tr><th style=\"width:40%\">Path<\u002Fth><th>Contains<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">styles.css<\u002Ftd><td class=\"d\">Entry point — import lines only<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/colors.css<\u002Ftd><td class=\"d\">Surfaces, ink, rules, gold, alert, tagline, dark scope<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/typography.css<\u002Ftd><td class=\"d\">Both families and both scales<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/spacing.css<\u002Ftd><td class=\"d\">Scale, gutters, spec-label column<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/borders.css<\u002Ftd><td class=\"d\">Hairlines, square corners, focus ring<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/motion.css<\u002Ftd><td class=\"d\">Easing and durations<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/base.css<\u002Ftd><td class=\"d\">Reset, link colours, mono label utilities<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">components/<\u002Ftd><td class=\"d\">JSX, props contract, usage notes<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">ui_kits/studio/<\u002Ftd><td class=\"d\">Three-screen reference implementation<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-losai-ink.png<\u002Ftd><td class=\"d\">LOSAI mark on paper — the default<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-losai-paper.png<\u002Ftd><td class=\"d\">LOSAI mark reversed<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-ink.png<\u002Ftd><td class=\"d\">Signature mark on paper<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-paper.png<\u002Ftd><td class=\"d\">Signature mark reversed<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-square-ink.png<\u002Ftd><td class=\"d\">Square stamp, mark reversed on ink<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-square-paper.png<\u002Ftd><td class=\"d\">Square stamp on the supplied ground<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">assets/logo-square-mark.png<\u002Ftd><td class=\"d\">Square stamp, transparent<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Implementation<\u002Fdiv>\n<p>One stylesheet, one bundle, one namespace. Never restate a token as a literal hex. For artifacts, copy the assets you need into the artifact’s own folder so the file stands alone.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Notes for developer / agent<\u002Fh2><span class=\"eyebrow\">10<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">Instructions for an AI agent designing on this system. Read them before producing anything in the studio's name.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Start here<\u002Fdiv>\n<p>Read <code>readme.md<\u002Fcode> first, then this document. Link <code>styles.css<\u002Fcode> and load <code>_ds_bundle.js<\u002Fcode>; every component is on one global namespace. Do not re-implement a component that already exists — mount it. Do not restate a token value as a literal when the custom property is available.<\u002Fp>\n<pre>&lt;link rel=\"stylesheet\" href=\"styles.css\"&gt;\n&lt;script src=\"_ds_bundle.js\"&gt;&lt;/script&gt;\n\nconst { Button, Field, Card, Table, Masthead, Lockup,\n        Badge, Tag, Callout, Cover, Stamp } = window.LOSAIStudioDesignSystem_3a6277;<\u002Fpre>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Never invent<\u002Fdiv>\n<ul>\n<li><strong>No new colours.<\u002Fstrong> If a value is not in <code>tokens/colors.css<\u002Fcode>, it is not in the brand. Do not tint, lighten or derive.<\u002Fli>\n<li><strong>No third typeface<\u002Fstrong>, and no third register — Cormorant is sentence case, mono is uppercase and tracked.<\u002Fli>\n<li><strong>No shadows, no radii, no gradients.<\u002Fstrong> The cover scrim over a photograph is the single exception.<\u002Fli>\n<li><strong>No hand-drawn SVG icons and no generated imagery.<\u002Fstrong> Where a photograph belongs, place a hairline frame with a mono filename caption and ask for the real material.<\u002Fli>\n<li><strong>Never redraw the mark.<\u002Fstrong> Use the supplied PNGs; never reconstruct it in type, outlines or paths.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">The five that get caught in review<\u002Fdiv>\n<ol>\n<li>Two gold marks in one view. Gold marks one thing; if a badge holds it, index numerals fall back to ink.<\u002Fli>\n<li><span class=\"m\">#9c3f2c<\u002Fspan> used as a highlight or a chart colour. It is error and caution only.<\u002Fli>\n<li>The blue used as a second accent. It sets the tagline and nothing else.<\u002Fli>\n<li>The lockup rebuilt by eye — mark paired with a new hairline and hand-set gaps. Place <code>Lockup<\u002Fcode>, scaled.<\u002Fli>\n<li>The mark standing alone, or its second line left empty beside a filled discipline line.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Producing work<\u002Fdiv>\n<p><strong>Artifacts<\u002Fstrong> — slides, mocks, throwaway prototypes: copy the assets you need out of <code>assets/<\u002Fcode> into the artifact's own folder and write static HTML. Do not reference paths back into the system directory; the file must stand on its own.<\u002Fp>\n<p><strong>Production code<\u002Fstrong>: link the stylesheet, take the components as written, and treat the standards in section 08 as review-blocking.<\u002Fp>\n<p><strong>When the brief is thin<\u002Fstrong>, the brand's default answer is less: more whitespace, fewer elements, one accent, and a hairline instead of a box. Ask for photography, copy and project data rather than inventing them — invented project names and fees have appeared in client-facing work before.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>The practice<\u002Fh2><span class=\"eyebrow\">11<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">LOSAI is <em>loci<\u002Fem> — the plural of <em>locus<\u002Fem>. The studio takes its name from the method of loci, the classical memory technique that binds what you want to remember to a place you already know.<\u002Fp>\n\n<div class=\"blk\">\n<p>The practice describes itself as a team of <strong>placemakers<\u002Fstrong>: buildings designed as anchors for experience and memory, not only as functional shells. That idea governs the system's restraint. A page is a place — ordered, quiet, and legible enough to be remembered. Ornament competes with recall, so there is none.<\u002Fp>\n<p>Pronounced <span class=\"m\">/ˈloʊ.saɪ/<\u002Fspan>. Written <strong>LOSAI studio<\u002Fstrong> — capitals then lowercase. Never \"LOSAI Studio\", never all-caps in body copy.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Practice<\u002Fdiv>\n<p>New York. Residential and commercial — apartments, townhouses, homes, multifamily, restaurant &amp; bar.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Representative projects<\u002Fdiv>\n<p>Duplex Penthouse, Flatiron District · Landmark Townhouse &amp; Rear Addition, Park Slope · Mass Timber Townhouse, Park Slope · Tobacco Modern Barn, Nissequogue · Wave Residential Tower, Beirut · Workshop Kitchen &amp; Bar, Palm Springs · Rooftop Lounge, Nomad · Tartinery Restaurant, Soho.<\u002Fp>\n<p class=\"cap\" style=\"margin-top:9pt\">Use these for realistic placeholder content rather than invented project names.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Sources<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:46%\">Source<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Written specification v3<\u002Ftd><td class=\"d\">Authoritative — the system is built from it<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\"><a href=\"https://github.com/LOSAIstudio/losai-design-system\">github.com/LOSAIstudio/losai-design-system<\u002Fa><\u002Ftd><td class=\"d\">Read — brand artwork and the authoritative palette. The system’s home repository.<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\"><a href=\"https://github.com/LOSAIstudio/losai-platform-v2\">github.com/LOSAIstudio/losai-platform-v2<\u002Fa> · <span class=\"m\">v2-main<\u002Fspan><\u002Ftd><td class=\"d\">Read — portal masthead, and the CP v2 proposal reference at <span class=\"m\">docs/refs/cp-v2/CP_v2.html<\u002Fspan><\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">losai.studio<\u002Ftd><td class=\"d\">Read — name origin, positioning, project list<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · The practice<\u002Fdiv>\n<p>Draw placeholder content from the representative projects above rather than inventing names, addresses or fees — invented project data has reached client-facing work before. Where you need a figure you do not have, say so in the copy instead of filling it in.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<div class=\"sec-head\"><h2>Index &amp; manifest<\u002Fh2><span class=\"eyebrow\">12<\u002Fspan><\u002Fdiv>\n<p class=\"lead\">What ships, and where it lives.<\u002Fp>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Foundations<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:40%\">File<\u002Fth><th>What it is<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">styles.css<\u002Ftd><td class=\"d\">The single entry point consumers link — <span class=\"m\">@import<\u002Fspan>s only<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/colors.css<\u002Ftd><td class=\"d\">Surfaces, ink, rules, gold, alert, Valcucine, and the <span class=\"m\">.losai-dark<\u002Fspan> scope<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/typography.css<\u002Ftd><td class=\"d\">The two families and both scales<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/spacing.css<\u002Ftd><td class=\"d\">The scale, gutters, and the 150px spec-label column<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/borders.css<\u002Ftd><td class=\"d\">Hairline definitions, square corners, focus ring<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/motion.css<\u002Ftd><td class=\"d\">Easing and durations<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/base.css<\u002Ftd><td class=\"d\">Reset, link colours, mono label utility<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">tokens/fonts.css<\u002Ftd><td class=\"d\">Cormorant Garamond + JetBrains Mono<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Components<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:40%\">Component<\u002Fth><th>What it is<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">Button<\u002Ftd><td class=\"d\">Ink, outline and text actions in three sizes<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Field · Checkbox · Radio<\u002Ftd><td class=\"d\">Underline input, boxed textarea, tick box, radio dot<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Card · FigureCard · Thumbnail<\u002Ftd><td class=\"d\">Image and bordered records, money figures, selectable thumbnails<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Table · SpecRows · MetaRow<\u002Ftd><td class=\"d\">Schedules, project facts, ruled meta columns<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Masthead · Breadcrumbs · Pager<\u002Ftd><td class=\"d\">The client portal header, trail and pager<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Lockup · Wordmark · Stamp<\u002Ftd><td class=\"d\">The identity lockup, the mark, the square emblem<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Badge · Tag<\u002Ftd><td class=\"d\">Project state, and toggleable filters<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Callout<\u002Ftd><td class=\"d\">Note, caution, pull quote and lead line<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Cover<\u002Ftd><td class=\"d\">Full-bleed dark or photographic cover<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">Proposal<\u002Ftd><td class=\"d\">Modular fee schedule whose totals recompute live<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<p class=\"cap\" style=\"margin-top:9pt\">Each directory carries the component, its props contract, a prompt file and a demo page. Read the prompt file before using a component — it holds the rules the props do not express.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Deliverables<\u002Fdiv>\n<table class=\"tok\">\n<thead><tr><th style=\"width:40%\">File<\u002Fth><th>What it is<\u002Fth><\u002Ftr><\u002Fthead>\n<tbody>\n<tr><td class=\"m\">standards/…-v2.html<\u002Ftd><td class=\"d\">This document, print-ready<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">standards/LOSAI Brand Standards v3.html<\u002Ftd><td class=\"d\">The same, self-contained for sharing<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">interactive/LOSAI Design System.html<\u002Ftd><td class=\"d\">Interactive reference — live components, per-section notes<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">ui_kits/studio/<\u002Ftd><td class=\"d\">Three-screen client-facing project surface<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">guidelines/<\u002Ftd><td class=\"d\">Foundation specimen cards<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">SKILL.md<\u002Ftd><td class=\"d\">Agent Skills wrapper for use in Claude Code<\u002Ftd><\u002Ftr>\n<tr><td class=\"m\">github.md<\u002Ftd><td class=\"d\">Source repositories and the screen map<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Repository<\u002Fdiv>\n<p>The system lives at <a href=\"https://github.com/LOSAIstudio/losai-design-system\"><strong>github.com/LOSAIstudio/losai-design-system<\u002Fstrong><\u002Fa>. Clone it, read <span class=\"m\">readme.md<\u002Fspan>, and link <span class=\"m\">styles.css<\u002Fspan>. The client portal and the CP v2 proposal reference this document draws on are at <a href=\"https://github.com/LOSAIstudio/losai-platform-v2\">github.com/LOSAIstudio/losai-platform-v2<\u002Fa> on branch <span class=\"m\">v2-main<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"blk\">\n<div class=\"lbl\" style=\"margin-bottom:11pt\">Outstanding materials<\u002Fdiv>\n<ul>\n<li><strong>Photography.<\u002Fstrong> None was supplied. Covers, image cards and thumbnails fall back to the <span class=\"m\">#ece9e0<\u002Fspan> image ground. Add real files and pass them through the <span class=\"m\">image<\u002Fspan> prop.<\u002Fli>\n<li><strong>Fonts.<\u002Fstrong> Both families load from Google Fonts. If the studio licenses self-hosted files, replace the <span class=\"m\">@import<\u002Fspan> in <span class=\"m\">tokens/fonts.css<\u002Fspan> with <span class=\"m\">@font-face<\u002Fspan> rules.<\u002Fli>\n<li><strong>Portal button metrics.<\u002Fstrong> The masthead's button padding and label size were measured from the deployed portal; that CSS block was not readable in the repository.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div class=\"cnote\">\n<div class=\"cnote-h\">Notes for developer / agent · Index<\u002Fdiv>\n<p>Read this document and the project readme before producing anything. Mount components from the compiled library rather than rebuilding them, and never restate a token as a literal hex. For artifacts, copy the assets you need into the artifact's own folder so the file stands alone.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n<script src=\"2f4bfa53-59d8-420c-9c6a-8b2cbd77a9f0\"><\u002Fscript>\n<script>\n(function(){\n  var DPI=96, PAGE_H=11*DPI, MARGIN=0.75*DPI;\n  function ready(){\n    if(!document.getElementById('flow')) return false;\n    for(var i=0;i<document.images.length;i++) if(!document.images[i].complete) return false;\n    return true;\n  }\n  var tries=0;\n  function build(){\n    var flow=document.getElementById('flow'); if(!flow) return;\n    Array.prototype.forEach.call(flow.querySelectorAll('.pgmark'),function(n){n.remove();});\n    var ftr=document.querySelector('[slot=\"footer\"]');\n    var ftrH=ftr?ftr.getBoundingClientRect().height:0;\n    var ftrSpace=Math.max(MARGIN, ftrH+MARGIN*0.45);\n    var contentH=PAGE_H-MARGIN-ftrSpace;\n    if(contentH<200) return;\n    var total=flow.scrollHeight;\n    if(!ready()||total<contentH*2){\n      if(tries++<40){ setTimeout(build,150); return; }\n    }\n    var flowTop=flow.getBoundingClientRect().top+window.scrollY;\n\n    // Forced page starts: every .sec carries break-before:page.\n    var forced=[];\n    Array.prototype.forEach.call(flow.querySelectorAll('.sec'),function(s){\n      forced.push(s.getBoundingClientRect().top+window.scrollY-flowTop);\n    });\n\n    // Unbreakable blocks: break-inside:avoid means the print engine pushes\n    // the whole block to the next sheet rather than splitting it.\n    var avoid=[];\n    Array.prototype.forEach.call(flow.querySelectorAll('.blk,.spec,table tr'),function(b){\n      var r=b.getBoundingClientRect();\n      if(r.height<=0) return;\n      avoid.push({top:r.top+window.scrollY-flowTop,h:r.height});\n    });\n    avoid.sort(function(a,b){return a.top-b.top;});\n\n    // The first block that straddles y and can survive a push, i.e. the\n    // real break point the engine would choose instead of y.\n    function pushedBy(y,cur){\n      for(var j=0;j<avoid.length;j++){\n        var a=avoid[j];\n        if(a.top>=y) break;\n        if(a.top>cur && a.top+a.h>y && a.h<=contentH) return a.top;\n      }\n      return y;\n    }\n\n    // Walk the flow, opening a new page at each forced break and\n    // every contentH of continuous copy in between.\n    var starts=[0], cur=0, fi=0, guard=0;\n    while(guard++<4000){\n      var nextForced=(fi<forced.length)?forced[fi]:Infinity;\n      var nextNatural=pushedBy(cur+contentH,cur);\n      if(nextForced<=nextNatural){\n        if(nextForced>=total) break;\n        if(nextForced>cur){ cur=nextForced; starts.push(cur); }\n        fi++;\n        continue;\n      }\n      if(nextNatural>=total) break;\n      if(nextNatural<=cur) nextNatural=cur+contentH;\n      cur=nextNatural; starts.push(cur);\n    }\n\n    // Drop slivers: a natural break landing just before a forced one\n    // would open a page the print engine never actually creates.\n    var MIN=90;\n    starts=starts.filter(function(s,i){\n      var end=(i+1<starts.length)?starts[i+1]:total;\n      return i===0 || (end-s)>=MIN;\n    });\n\n    var pages=starts.length;\n    for(var i=0;i<pages;i++){\n      var bottom=(i+1<pages)?Math.min(starts[i]+contentH,starts[i+1]):Math.min(starts[i]+contentH,total);\n      var m=document.createElement('div');\n      m.className='pgmark';\n      m.textContent='PAGE '+(i+1)+' OF '+pages;\n      m.style.top=(bottom-13)+'px';\n      flow.appendChild(m);\n    }\n    flow.setAttribute('data-pages',pages);\n  }\n  function schedule(){ tries=0; setTimeout(build,60); }\n  if(document.readyState==='complete') schedule();\n  else window.addEventListener('load',schedule);\n  window.addEventListener('beforeprint',function(){tries=99;build();});\n  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);\n  Array.prototype.forEach.call(document.images,function(im){\n    if(!im.complete) im.addEventListener('load',schedule,{once:true});\n  });\n  if(window.ResizeObserver){\n    var last=0, ro=new ResizeObserver(function(){\n      var f=document.getElementById('flow'); if(!f) return;\n      var h=f.scrollHeight;\n      if(Math.abs(h-last)>4){ last=h; schedule(); }\n    });\n    var f0=document.getElementById('flow'); if(f0) ro.observe(f0);\n  }\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
