<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--losai-cp-paper);margin:0;padding:0}
.row{display:flex}
.sw{flex:1;height:112px;display:flex;flex-direction:column;justify-content:flex-end;padding:11px 13px;gap:3px}
.n{font-family:var(--losai-font-info);font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.h{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.10em;text-transform:uppercase;opacity:.72}
.cap{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint);padding:11px 13px}
</style></head><body>
<div class="row">
<div class="sw" style="background:#4c586e;color:#faf9f5"><span class="n">Blue</span><span class="h">#4c586e</span></div>
<div class="sw" style="background:#823930;color:#faf9f5"><span class="n">Red</span><span class="h">#823930</span></div>
<div class="sw" style="background:#b96e4f;color:#faf9f5"><span class="n">Orange</span><span class="h">#b96e4f</span></div>
<div class="sw" style="background:#bc9381;color:#1c1a17"><span class="n">Beige</span><span class="h">#bc9381</span></div>
</div>
<div class="cap">Held separately from the core neutrals. Blue also sets the tagline and the portal's project line; beige reads as a lighter gold but does not replace #a5824e as the accent.</div>
</body></html>
