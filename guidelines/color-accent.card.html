<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><title>Accent</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--losai-paper);margin:0;padding:22px}.g{display:grid;gap:0}.row{display:flex;gap:0;align-items:stretch}
.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px}
.n{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase}
.meta{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint);margin-top:8px}
.lbl{font-family:var(--losai-font-info);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--losai-label)}
</style></head><body><div class="row"><div class="sw" style="background:#a5824e;color:#faf9f5"><span class="n">Gold<br>#a5824e</span></div><div class="sw" style="background:#9c3f2c;color:#faf9f5"><span class="n">Alert<br>#9c3f2c</span></div><div class="sw" style="background:var(--losai-paper);border:1px solid var(--losai-rule-strong);color:var(--losai-gold)"><span class="n">Gold on paper<br>index · active underline</span></div></div>
<div class="meta">One gold mark per view — an index numeral, an active underline, a selected tick. Never gold over imagery. Alert never decorates.</div></body></html>
