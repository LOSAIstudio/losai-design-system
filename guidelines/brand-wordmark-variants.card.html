<!-- @dsCard group="Brand" viewport="700x246" name="Wordmark variants" subtitle="One width for all three — LOSAI, signature, serif stand-in" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--losai-paper);margin:0;padding:22px}
.r{display:grid;grid-template-columns:120px 200px 1fr;gap:22px;align-items:center;padding:16px 0;border-bottom:.5px solid var(--losai-rule)}
.r:last-child{border-bottom:0}
.lbl{font-family:var(--losai-font-info);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--losai-label)}
.cap{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint)}
img{display:block;width:180px;height:auto}
.srf{display:block;width:180px;font-family:var(--losai-font-voice);font-weight:500;font-size:39.7px;letter-spacing:.04em;line-height:.94;white-space:nowrap;color:var(--losai-mark)}
.srf em{font-style:italic;font-weight:400;font-size:.56em;letter-spacing:.03em;margin-left:.3em}
</style></head><body>
<div class="r"><div class="lbl">LOSAI</div><div><img src="../assets/logo-losai-ink.png" alt="LOSAI"></div><div class="cap">Default · pairs with the discipline line and tagline</div></div>
<div class="r"><div class="lbl">Signature</div><div><img src="../assets/logo-ink.png" alt="LOSAI studio"></div><div class="cap">Where the mark must say studio alone</div></div>
<div class="r"><div class="lbl">Serif</div><div><span class="srf">LOSAI<em>studio</em></span></div><div class="cap">Stand-in only, when no mark file loads</div></div>
</body></html>
