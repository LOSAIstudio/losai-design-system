<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><title>Geometry</title><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--losai-paper);margin:0;padding:22px}.g{display:grid;gap:0}.row{display:flex;gap:0;align-items:stretch}
.sw{flex:1;height:74px;display:flex;align-items:flex-end;padding:8px}
.n{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase}
.meta{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint);margin-top:8px}

</style></head><body><div style="display:flex;gap:22px;align-items:stretch">
<div style="flex:1;border:1px solid var(--losai-rule-strong);padding:18px"><div class="lbl">Correct</div><div style="height:44px;border:1px solid var(--losai-ink);margin-top:10px"></div></div>
<div style="flex:1;border:1px solid var(--losai-rule);padding:18px;opacity:.55"><div class="lbl" style="color:var(--losai-alert)">Never</div><div style="height:44px;border:1px solid var(--losai-disabled);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);margin-top:10px"></div></div>
