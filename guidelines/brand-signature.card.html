<!-- @dsCard group="Brand" viewport="700x150" name="Serif stand-in" subtitle="Name set in type, filling the mark's slot" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--losai-paper);margin:0;padding:0}
.lock{--k:.92;position:relative;width:calc(731px*var(--k));height:calc(132px*var(--k))}
.lock>.srf{position:absolute;left:calc(27px*var(--k));top:calc(41px*var(--k));width:calc(217px*var(--k));font-family:var(--losai-font-voice);font-weight:500;font-size:calc(47.8px*var(--k));letter-spacing:.04em;line-height:1;white-space:nowrap;color:var(--losai-mark)}
.lock>.srf em{font-style:italic;font-weight:400;font-size:.56em;letter-spacing:.03em;margin-left:.3em}
.lock>.rl{position:absolute;left:calc(274px*var(--k));top:calc(46px*var(--k));width:1px;height:calc(45px*var(--k));background:var(--losai-rule-strong)}
.lock>.dsc{position:absolute;left:calc(298px*var(--k));top:calc(46.3px*var(--k));font-family:var(--losai-font-info);font-size:calc(11.43px*var(--k));letter-spacing:.15em;text-transform:uppercase;line-height:1;color:#8f877f;white-space:nowrap}
.lock>.tg{position:absolute;left:calc(298px*var(--k));top:calc(62.4px*var(--k));font-family:var(--losai-font-voice);font-style:italic;font-size:calc(21.22px*var(--k));line-height:1.15;color:var(--losai-tagline);white-space:nowrap}
.cap{font-family:var(--losai-font-info);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--losai-faint);padding:0 25px}
</style></head><body>
<div class="lock">
<span class="srf">LOSAI<em>studio</em></span>
<span class="rl"></span>
<div class="dsc">Architecture &amp; Design</div>
<div class="tg">Designing city and country homes as places of refuge.</div>
</div>
<div class="cap">Cormorant 500 at 47.8px, italic "studio" 0.56em — fills the mark's 217px slot, so the rule and text never move.</div>
</body></html>
